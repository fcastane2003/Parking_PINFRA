name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Add Python to PATH
      run: |
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311" >> $env:GITHUB_PATH
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311\Scripts" >> $env:GITHUB_PATH

    - name: Verify Python
      run: |
        python --version
        pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci-123456789" >> .env
        echo "DATABASE_URL=sqlite:///./test.db" >> .env
        echo "INITIAL_ADMIN_USERNAME=${{ secrets.INITIAL_ADMIN_USERNAME }}" >> .env
        echo "INITIAL_ADMIN_PASSWORD=${{ secrets.INITIAL_ADMIN_PASSWORD }}" >> .env
        echo "INITIAL_ADMIN_EMAIL=admin@example.com" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
        echo "REFRESH_TOKEN_EXPIRE_MINUTES=10080" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ALLOWED_ORIGINS=[\""http://localhost:3000"\", \""http://127.0.0.1:3000"\", \""http://localhost:8000"\"]" >> .env

    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        pytest -v

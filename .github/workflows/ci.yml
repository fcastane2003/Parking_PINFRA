name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Add Python to PATH
      run: |
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311" >> $env:GITHUB_PATH
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311\Scripts" >> $env:GITHUB_PATH

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Verify Python
      run: |
        python --version
        pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        @"
        SECRET_KEY=test-secret-key-for-ci-123456789
        DATABASE_URL=sqlite:///./test.db
        INITIAL_ADMIN_USERNAME=${{ secrets.INITIAL_ADMIN_USERNAME }}
        INITIAL_ADMIN_PASSWORD=${{ secrets.INITIAL_ADMIN_PASSWORD }}
        INITIAL_ADMIN_EMAIL=admin@example.com
        ACCESS_TOKEN_EXPIRE_MINUTES=30
        REFRESH_TOKEN_EXPIRE_MINUTES=10080
        ALGORITHM=HS256
        ALLOWED_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8000"]
        "@ | Out-File -FilePath .env -Encoding utf8

    - name: Create database tables
      run: |
        python -c "from app.db.session import engine; from app.db.models import Base; Base.metadata.create_all(engine)"

    - name: Run create_admin.py
      run: |
        python create_admin.py

    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        pytest -v

  lint:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Add Python to PATH
      run: |
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311" >> $env:GITHUB_PATH
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311\Scripts" >> $env:GITHUB_PATH

    - name: Install dev dependencies
      run: |
        pip install black flake8

    - name: Run black
      run: |
        black --check .

    - name: Run flake8
      run: |
        flake8

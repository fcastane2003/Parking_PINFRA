name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Add Python to PATH
      run: |
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311" >> $env:GITHUB_PATH
        echo "C:\Users\francisco.castaneda\AppData\Local\Programs\Python\Python311\Scripts" >> $env:GITHUB_PATH

    - name: Verify Python
      run: |
        python --version
        pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME }}
        INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        DATABASE_URL: sqlite:///./test.db
      run: |
        pytest -v

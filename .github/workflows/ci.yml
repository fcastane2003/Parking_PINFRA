name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: List directory structure
      run: |
        ls -la
        ls -la app/

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "INITIAL_ADMIN_USERNAME=${{ secrets.INITIAL_ADMIN_USERNAME }}" >> .env
        echo "INITIAL_ADMIN_PASSWORD=${{ secrets.INITIAL_ADMIN_PASSWORD }}" >> .env
        cat .env

    - name: Run create_admin.py
      run: |
        python create_admin.py

    - name: Run tests
      run: |
        pytest -v
